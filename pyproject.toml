[project]
name = "fastapi-questions"
version = "0.1.0"
description = "API de preguntas con FastAPI y Hugging Face"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pandas (==2.2.3)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "requests (>=2.34.1,<3.0.0)",
    "datasets (>=4.8.5,<5.0.0)",
    "torch (==2.2.2)",
    "transformers (==4.57.6)",
    "sentence-transformers (==4.1.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "numpy (==1.26.4)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]